<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متاهة نافس المتكاملة 🛡️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon-pink: #ff79c6; --neon-blue: #8be9fd; --wall: #282a36; --exit: #f1fa8c; }
        body { background: #0f0f17; color: white; font-family: 'Tajawal', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        /* الشريط العلوي للوقت والنقاط */
        .top-bar { display: flex; justify-content: space-around; width: 850px; background: rgba(40, 42, 54, 0.9); padding: 10px 20px; border-radius: 15px; border: 2px solid var(--neon-blue); margin-bottom: 15px; font-weight: bold; font-size: 17px; color: var(--neon-blue); box-shadow: 0 0 20px rgba(139,233,253,0.2); }

        .game-container { display: flex; gap: 30px; align-items: flex-start; }
        #maze-grid { display: grid; grid-template-columns: repeat(12, 40px); grid-template-rows: repeat(12, 40px); gap: 0; background: #1a1a24; border: 4px solid var(--neon-blue); position: relative; }
        .cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .wall { background: var(--wall); box-shadow: inset 0 0 15px #000; }
        .path { background: rgba(139, 233, 253, 0.05); }
        .exit-door { background: var(--exit); box-shadow: 0 0 20px var(--exit); }
        
        /* إطار وتوهج أبيض للشخصية داخل المتاهة لتكون واضحة */
        .player-img { width: 35px; height: 35px; transition: 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); z-index: 10; object-fit: contain; filter: drop-shadow(0 0 6px white) drop-shadow(0 0 2px white); }
        .monster-img { width: 35px; height: 35px; transition: 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); z-index: 10; object-fit: contain; filter: drop-shadow(0 0 10px red); }
        
        /* لوحة الأسئلة */
        .quiz-side { width: 420px; background: rgba(40, 42, 54, 0.95); padding: 20px; border-radius: 20px; border: 2px solid var(--neon-pink); box-shadow: 0 0 30px rgba(255,121,198,0.2); display: flex; flex-direction: column; }
        
        #section-title { color: var(--neon-pink); margin-top: 0; margin-bottom: 12px; font-size: 16px; font-weight: bold; text-align: right; }
        #question { font-size: 17px; color: #f1fa8c; margin-bottom: 15px; font-weight: bold; line-height: 1.5; text-align: right; }
        .options { display: flex; flex-direction: column; gap: 8px; }
        button.opt-btn, .section-btn { background: rgba(255,121,198,0.1); border: 1px solid var(--neon-pink); padding: 10px 14px; color: white; border-radius: 12px; cursor: pointer; font-size: 15px; font-family: 'Tajawal', sans-serif; transition: 0.3s; text-align: right; width: 100%; }
        button.opt-btn:hover, .section-btn:hover { background: var(--neon-pink); color: black; font-weight: bold; }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f17; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .char-options { display: flex; gap: 30px; justify-content: center; }
        
        /* المربعات الخاصة باختيار الشخصيات أصبحت بيضاء بالكامل وواضحة جداً */
        .char-box { cursor: pointer; border: 4px solid var(--neon-pink); padding: 20px; border-radius: 25px; transition: 0.3s; background: #ffffff; box-shadow: 0 0 25px rgba(255,121,198,0.4); }
        .char-box:hover { transform: scale(1.1); box-shadow: 0 0 35px #ffffff; }
        .char-box img { width: 110px; height: 110px; object-fit: contain; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- شاشة اختيار الشخصية -->
    <div id="selection-screen" class="screen">
        <h1 style="color: var(--neon-pink); margin-bottom: 35px; text-shadow: 0 0 10px rgba(255,121,198,0.5);">اختر شخصيتك المفضلة في متاهة نافس</h1>
        <div class="char-options">
            <div class="char-box" onclick="selectHero('https://img.icons8.com/color/160/hello-kitty.png')">
                <img src="https://img.icons8.com/color/160/hello-kitty.png" alt="Hello Kitty">
            </div>
            <div class="char-box" onclick="selectHero('https://img.icons8.com/color/160/my-melody.png')">
                <img src="https://img.icons8.com/color/160/my-melody.png" alt="My Melody">
            </div>
        </div>
    </div>

    <!-- شاشة الانتقال بين المراحل -->
    <div id="section-screen" class="screen hidden">
        <h1 id="stage-title" style="color: var(--neon-pink); margin-bottom: 20px;">المرحلة الأولى: متاهة العلوم</h1>
        <p style="color: #f1fa8c; margin-bottom: 20px; font-size: 18px;">أجب على جميع الأسئلة لتفوز وتنتقل لمرحلة الرياضيات!</p>
        <div style="display: flex; flex-direction: column; width: 350px; gap: 15px;">
            <button class="section-btn" onclick="startStageGame()">🚀 ابدأ رحلة العلوم الآن</button>
        </div>
    </div>

    <!-- شريط الوقت والنقاط في الأعلى -->
    <div class="top-bar">
        <span id="score-display">🌟 النقاط: 0</span>
        <span id="stage-display">📚 المرحلة: العلوم</span>
        <span id="timer-display">⏳ الوقت الإجمالي: 01:30:00</span>
    </div>

    <!-- واجهة اللعبة الأساسية -->
    <div class="game-container">
        <div id="maze-grid"></div>
        <div class="quiz-side">
            <h2 id="section-title">لوحة الأسئلة</h2>
            <div id="question-area">
                <p id="question">جاري تجهيز المتاهة...</p>
                <div class="options" id="options"></div>
            </div>
            <p id="feedback" style="margin-top: 12px; font-weight: bold; font-size: 15px; text-align: right; min-height: 45px;"></p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
